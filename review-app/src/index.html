<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CFHG · Website review</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="login" class="login" hidden><form id="login-form" class="login-card"><div class="mark">CFHG</div><h1>Website review</h1><p>Enter the access code to review the pages and leave feedback.</p><label for="code">Access code</label><input id="code" name="code" type="password" required autocomplete="current-password"><button type="submit">Open review</button><p id="login-error" class="error" role="alert"></p></form></div>
<div id="app" hidden><header class="topbar"><div class="brand"><span class="mark">CFHG</span><span>Website review</span></div><div class="top-actions"><span id="page-count"></span><a href="/api/export" download>Export feedback</a></div></header>
<div class="layout"><aside class="sidebar"><label for="name">Your name</label><input id="name" placeholder="Enter your name" maxlength="80"><p class="hint">Your notes save automatically and are visible to other reviewers.</p><label for="page-search">Pages</label><input id="page-search" type="search" placeholder="Find a page"><nav id="pages" aria-label="Pages"></nav></aside>
<main class="workspace"><div class="pagebar"><div><span class="eyebrow">Page review</span><h1 id="page-title"></h1><a id="live-link" target="_blank" rel="noopener">Open live page</a></div><div class="page-nav"><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></div></div>
<div class="panels"><section class="preview-panel" aria-label="Website preview"><div class="panel-heading"><h2>Page preview</h2><span>Scroll to explore</span></div><iframe id="preview" title="Website page preview"></iframe></section><section class="feedback-panel" aria-label="Feedback"><div class="panel-heading"><h2>Feedback by content block</h2><span id="block-count"></span></div><div id="feedback-list"></div></section></div></main></div></div><script type="module" src="/app.js"></script></body></html>
